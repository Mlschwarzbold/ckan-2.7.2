# CKAN 2.7 ETL test instance — see plan.md / requirements.md.
# Usage:  cp .env.example .env   # then edit host-specific values
#         docker compose up -d
# Reset:  docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:9.6.18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    # Second (datastore) database + read-only role, created on first boot only.
    configs:
      - source: datastore_init
        target: /docker-entrypoint-initdb.d/00_datastore.sql
    healthcheck:
      # -h 127.0.0.1 so it waits for init scripts to finish (temp server is unix-socket only).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  solr:
    image: ckan/ckan-solr:2.7
    volumes:
      - solr:/opt/solr/server/solr/ckan
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8983/solr/ckan/admin/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  datapusher:
    # Present for prod parity only — the ETL path does not use it.
    image: keitaro/ckan-datapusher:0.0.14

  ckan:
    image: keitaro/ckan:2.7
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
    ports:
      - "${CKAN_PORT}:5000"
    environment:
      CKAN_SITE_ID: ${CKAN_SITE_ID}
      CKAN_SITE_URL: ${CKAN_SITE_URL}
      CKAN_SQLALCHEMY_URL: ${CKAN_SQLALCHEMY_URL}
      CKAN_DATASTORE_WRITE_URL: ${CKAN_DATASTORE_WRITE_URL}
      CKAN_DATASTORE_READ_URL: ${CKAN_DATASTORE_READ_URL}
      CKAN_SOLR_URL: ${CKAN_SOLR_URL}
      CKAN_DATAPUSHER_URL: ${CKAN_DATAPUSHER_URL}
      CKAN__PLUGINS: ${CKAN__PLUGINS}
      # FileStore is CKAN core, not a plugin: storage path + named volume.
      CKAN_STORAGE_PATH: ${CKAN_STORAGE_PATH}
      CKAN__MAX_RESOURCE_SIZE: ${CKAN_MAX_RESOURCE_SIZE}
      # prerun.py auto-creates and promotes this user as sysadmin on boot.
      CKAN_SYSADMIN_NAME: ${CKAN_SYSADMIN_NAME}
      CKAN_SYSADMIN_PASSWORD: ${CKAN_SYSADMIN_PASSWORD}
      CKAN_SYSADMIN_EMAIL: ${CKAN_SYSADMIN_EMAIL}
    volumes:
      - filestore:/srv/app/data

volumes:
  pgdata:
  solr:
  filestore:

configs:
  datastore_init:
    content: |
      CREATE ROLE ${DATASTORE_READONLY_USER} NOSUPERUSER NOCREATEDB NOCREATEROLE LOGIN PASSWORD '${DATASTORE_READONLY_PASSWORD}';
      CREATE DATABASE ${DATASTORE_DB} OWNER ${POSTGRES_USER} ENCODING 'utf-8';
